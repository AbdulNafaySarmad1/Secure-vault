version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: securevault-db
    environment:
      POSTGRES_DB: securevault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securevault123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - securevault-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: securevault-api
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: securevault
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-securevault123}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-your-32-byte-encryption-key!!!}
      CLIENT_URL: http://localhost:3000
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - securevault-network
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node src/scripts/seed.js && npm start"

  frontend:
    build: ./frontend
    container_name: securevault-web
    ports:
      - "3000:80"
    networks:
      - securevault-network
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:

networks:
  securevault-network:
    driver: bridge
